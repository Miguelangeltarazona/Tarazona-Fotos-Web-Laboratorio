<script>
const APPWRITE_ENDPOINT='https://fra.cloud.appwrite.io/v1';
const APPWRITE_PROJECT_ID='6ac131aa0027074df282';
const sb=window.sb;
const app=document.getElementById('app'), modal=document.getElementById('modal'), body=document.getElementById('body'), accountBtn=document.getElementById('accountBtn');
let albumCache=[], siteSettings=null, siteSettingsAt=0, albumStatsCache=new Map(), albumStatsAt=0, viewerZoom=1, activeMessageUser=null, messagePolling=null;
let cachedUser=null, authStateReady=false, authInitPromise=null;
const profileCache=new Map(), profileCacheAt=new Map(), themeCache=new Map(), themeCacheAt=new Map();
const mediaCache=new Map();

sb.auth.onAuthStateChange((event,session)=>{
  cachedUser=session?.user||null;
  authStateReady=true;
  authInitPromise=null;
  if(event==='PASSWORD_RECOVERY')setTimeout(()=>openNewPassword(),50);
  // Refresh the UI without blocking authentication callbacks.
  if(typeof refreshHeader==='function')setTimeout(()=>refreshHeader().catch(()=>{}),0);
});
function openNewPassword(){body.innerHTML=`<div class="modal-head"><label>TARAZONA FOTOS</label><h2>Cambiar contraseña</h2><p>Escribe tu nueva contraseña.</p></div>${passwordInput('newPass','new-password','Nueva contraseña (mínimo 8 caracteres)')}${passwordInput('newPass2','new-password','Repite la nueva contraseña')}<button class="cta full" onclick="saveNewPassword()">Guardar nueva contraseña</button>`;modal.classList.remove('hide');setTimeout(()=>document.getElementById('newPass')?.focus(),80)}
async function saveNewPassword(){const p1=document.getElementById('newPass')?.value||'',p2=document.getElementById('newPass2')?.value||'';if(p1.length<8)return toast('La contraseña debe tener al menos 8 caracteres.');if(p1!==p2)return toast('Las dos contraseñas no coinciden.');const {error}=await sb.auth.updateUser({password:p1});if(error)return toast(error.message);body.innerHTML=`<div class="success"><div>✅</div><h2>Contraseña actualizada</h2><p>Ya puedes entrar con tu nueva contraseña.</p><button class="cta" onclick="closeM();accountRoute()">Continuar</button></div>`}

const fallbackSite={site_name:'Tarazona Fotos',hero_title:'Los momentos que merecen quedarse.',hero_subtitle:'Las fotos de nuestra falla, organizadas por años y eventos para que puedas encontrarlas, descargarlas y conservarlas.',about_text:'Tarazona Fotos es la fototeca privada de la Falla Raval d’Alcàsser.',contact_email:'',accent_color:'#08bfc0',welcome_text:'Fallas, gente, momentos... ¡y mucho más!'};

function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2800)}
function dateLabel(v){if(!v)return 'Archivo';const d=new Date(String(v).length<=10?v+'T12:00:00':v);return isNaN(d)?String(v):d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});}
function formatBytes(n){n=Number(n)||0;if(!n)return '0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return `${n.toFixed(i?1:0)} ${u[i]}`}
function coverClass(i=0){return `cover c${Math.abs(i)%6}`}
async function currentUser(){
  if(authStateReady)return cachedUser;
  if(!authInitPromise){
    authInitPromise=sb.auth.getSession().then(({data})=>{
      cachedUser=data?.session?.user||null;
      authStateReady=true;
      return cachedUser;
    }).catch(()=>{authStateReady=true;cachedUser=null;return null});
  }
  return authInitPromise;
}
async function functionAuthHeaders(){const {data,error}=await sb.auth.getSession();if(error||!data?.session)return null;return {};}
async function getCachedProfile(userId,fields='full_name,role,avatar_path'){
  if(!userId)return null;
  const now=Date.now(), stamp=profileCacheAt.get(userId)||0, hit=profileCache.get(userId);
  if(hit&&now-stamp<120000)return hit;
  try{const {data}=await sb.from('profiles').select(fields).eq('id',userId).maybeSingle();if(data){profileCache.set(userId,data);profileCacheAt.set(userId,now);return data;}}catch(e){}
  return hit||null;
}
function toggleSide(){document.querySelector('.sidebar')?.classList.toggle('open');document.getElementById('sideBackdrop')?.classList.toggle('open')}
function closeSide(){document.querySelector('.sidebar')?.classList.remove('open');document.getElementById('sideBackdrop')?.classList.remove('open')}
function closeM(){modal.classList.add('hide');viewerZoom=1}
function applyAccent(hex){if(/^#[0-9a-fA-F]{6}$/.test(hex||'')){document.documentElement.style.setProperty('--accent',hex);document.documentElement.style.setProperty('--accent-dynamic',hex)}}
async function loadSettings(force=false){
  const fresh=siteSettings&&Date.now()-siteSettingsAt<120000;
  if(!force&&fresh){applyAccent(siteSettings.accent_color);document.title=siteSettings.site_name||'Tarazona Fotos';return siteSettings}
  const {data}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();
  siteSettings={...fallbackSite,...(data||{})};siteSettingsAt=Date.now();applyAccent(siteSettings.accent_color);document.title=siteSettings.site_name||'Tarazona Fotos';
  const banner=document.getElementById('siteBannerImg');
  if(banner){banner.src=siteSettings.cover_path?await mediaUrl(siteSettings.cover_path):'tarazona-header.jpg'}
  return siteSettings
}
function placeMenuBelowBanner(){const b=document.querySelector('.site-banner');if(!b)return;const r=b.getBoundingClientRect();const top=Math.max(120,Math.round(r.bottom+34));document.documentElement.style.setProperty('--tf-menu-top',top+'px')}
window.addEventListener('load',placeMenuBelowBanner);window.addEventListener('resize',()=>setTimeout(placeMenuBelowBanner,60));
async function mediaUrl(path){
  if(!path)return '';
  const key=String(path);
  const isDropbox=key.startsWith('dropbox:');
  const userKey=cachedUser?.id||'anon';
  const cacheKey=`${userKey}|${key}`;
  const now=Date.now();
  const hit=mediaCache.get(cacheKey);
  if(hit?.url&&hit.expiresAt>now)return hit.url;
  if(hit?.promise)return hit.promise;

  // Persist signed media URLs in this browser session so a page reload does not
  // generate a new URL for every photo. The URL itself is still time-limited.
  if(!isDropbox){
    if(!/^[A-Za-z0-9._-]{20,36}$/.test(key))return '';
    try{
      const raw=sessionStorage.getItem(`tf-media-v26:${cacheKey}`);
      if(raw){const item=JSON.parse(raw);if(item?.url&&item.expiresAt>now){mediaCache.set(cacheKey,item);return item.url;}}
    }catch(e){}
    const promise=sb.storage.from('photos').createSignedUrl(key,21600).then(({data})=>{
      const url=data?.signedUrl||'';
      if(url){const item={url,expiresAt:now+19800000};mediaCache.set(cacheKey,item);try{sessionStorage.setItem(`tf-media-v26:${cacheKey}`,JSON.stringify(item));}catch(e){}}
      else mediaCache.delete(cacheKey);
      return url;
    }).catch(()=>{mediaCache.delete(cacheKey);return '';});
    mediaCache.set(cacheKey,{promise});
    return promise;
  }

  const headers=await functionAuthHeaders();
  if(!headers)return '';
  const promise=sb.functions.invoke('dropbox-media?action=link',{body:{path:key},headers}).then(({data,error})=>{
    const url=error?'':(data?.url||'');
    if(url)mediaCache.set(cacheKey,{url,expiresAt:now+300000});else mediaCache.delete(cacheKey);
    return url;
  }).catch(()=>{mediaCache.delete(cacheKey);return '';});
  mediaCache.set(cacheKey,{promise});
  return promise;
}
async function deleteMedia(path){if(!String(path).startsWith('dropbox:'))return (await sb.storage.from('photos').remove([path])).error||null;const headers=await functionAuthHeaders();if(!headers)return new Error('La sesión ha caducado.');const {data,error}=await sb.functions.invoke('dropbox-media?action=delete',{body:{path},headers});return error||(data?.error?new Error(data.error):null)}
async function adminCall(action,payload={},file=null){const fd=new FormData();fd.append('action',action);fd.append('payload',JSON.stringify(payload));if(file)fd.append('file',file,file.name);const {data,error}=await sb.functions.invoke('site-admin',{body:fd});if(error)throw error;if(data?.error)throw new Error(data.error);return data||{}}
function adminButton(tab){return [...document.querySelectorAll('.tabs button')].find(b=>b.dataset.adminTab===tab)||null}
async function adminTabRefresh(tab){return adminTab(tab,adminButton(tab))}

async function loadTheme(){
  let mode=localStorage.getItem('tf-theme-mode')||siteSettings?.default_theme||'auto';
  try{
    const u=await currentUser();
    if(u){
      const now=Date.now(), stamp=themeCacheAt.get(u.id)||0;
      let data=themeCache.get(u.id);
      if(!data||now-stamp>300000){
        const r=await sb.from('user_preferences').select('theme_mode,dark_mode').eq('user_id',u.id).maybeSingle();
        data=r.data||null;themeCache.set(u.id,data);themeCacheAt.set(u.id,now);
      }
      if(data?.theme_mode)mode=data.theme_mode;else if(data?.dark_mode===true)mode='dark';else if(data?.dark_mode===false)mode='light';
    }
  }catch(e){}
  const dark=mode==='dark'||(mode==='auto'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark-mode',dark);document.documentElement.dataset.themeMode=mode;
  const tm=document.getElementById('themeMenuLabel');
  if(tm)tm.textContent=dark?'Modo claro':'Modo oscuro';
  const ti=document.querySelector('#themeMenuBtn span:first-child');
  if(ti)ti.textContent=dark?'☀️':'🌙';
  return mode;
}
async function setThemeMode(mode){
  if(!['auto','light','dark'].includes(mode))mode='auto';
  localStorage.setItem('tf-theme-mode',mode);
  try{const u=await currentUser();if(u){const data={user_id:u.id,theme_mode:mode,dark_mode:mode==='dark',updated_at:new Date().toISOString()};themeCache.set(u.id,data);themeCacheAt.set(u.id,Date.now());await adminCall('save-preference',data)}}catch(e){}
  await loadTheme();toast(mode==='auto'?'Modo automático activado.':mode==='dark'?'Modo oscuro activado.':'Modo claro activado.');
}
async function toggleUserTheme(){
  const u=await currentUser();
  if(!u){openLogin();return;}
  const dark=document.body.classList.contains('dark-mode');
  await setThemeMode(dark?'light':'dark');
}
function themeControl(selected='auto'){return `<select onchange="setThemeMode(this.value)" aria-label="Tema"><option value="auto"${selected==='auto'?' selected':''}>Automático</option><option value="light"${selected==='light'?' selected':''}>Claro</option><option value="dark"${selected==='dark'?' selected':''}>Oscuro</option></select>`}

async function getAlbumStats(ids){
  const list=[...(ids||[])];if(!list.length)return {};
  const now=Date.now();if(albumStatsAt&&now-albumStatsAt<30000){
    const cached={};for(const id of list)if(albumStatsCache.has(id))cached[id]=albumStatsCache.get(id);
    if(Object.keys(cached).length===list.length)return cached;
  }
  const out={};for(const id of list)out[id]={bytes:0,count:0};
  const meta=albumCache.filter(a=>list.includes(a.id)).map(a=>({id:a.id,title:a.title}));
  const [photoRes,sessionRes]=await Promise.all([
    sb.from('photos').select('album_id').in('album_id',list),
    sb.auth.getSession()
  ]);
  for(const r of (photoRes.data||[])){if(!out[r.album_id])out[r.album_id]={bytes:0,count:0};out[r.album_id].count++}
  const session=sessionRes.data?.session;
  if(session){
    try{
      const {data}=await sb.functions.invoke('dropbox-media?action=stats',{body:{}});
      const byTitle=new Map((data?.albums||[]).map(a=>[String(a.title||'').trim().toLowerCase(),{bytes:Number(a.bytes||0),count:Number(a.photos||0)}]));
      for(const a of meta){const st=byTitle.get(String(a.title||'').trim().toLowerCase());if(!st)continue;out[a.id].bytes=Math.max(out[a.id].bytes,st.bytes);if(out[a.id].count===0&&st.count>0)out[a.id].count=st.count}
    }catch(e){}
  }
  albumStatsCache=new Map(Object.entries({...Object.fromEntries(albumStatsCache),...out}));albumStatsAt=Date.now();return out;
}

function updateAlbumCards(stats){
  document.querySelectorAll('.card[data-album-id]').forEach(card=>{
    const id=card.dataset.albumId, s=stats?.[id]; if(!s)return;
    const meta=card.querySelector('.card-meta'); if(!meta)return;
    const n=Number(s.count||0),bytes=Number(s.bytes||0);
    meta.textContent=`${n.toLocaleString('es-ES')} ${n===1?'foto':'fotos'}${bytes?` · ${formatBytes(bytes)}`:' · Tamaño no disponible'}`;
  });
}

async function hydrateAlbumCovers(list){
  const ids=(list||[]).map(a=>a.id).filter(Boolean);if(!ids.length)return;
  const {data:ps}=await sb.from('photos').select('album_id,storage_path,created_at').in('album_id',ids).order('created_at',{ascending:true});
  const first={};for(const p of ps||[]){if(!first[p.album_id])first[p.album_id]=p.storage_path}
  const entries=Object.entries(first);let cursor=0;
  async function worker(){while(cursor<entries.length){const i=cursor++, [albumId,path]=entries[i];try{const url=await mediaUrl(path);if(!url)continue;const card=document.querySelector(`.card[data-album-id="${CSS.escape(albumId)}"] .cover`);if(card){card.style.backgroundImage=`url(\"${url.replace(/\"/g,'\\"')}\")`;card.style.backgroundSize='cover';card.style.backgroundPosition='center'}}catch(e){}}}
  await Promise.all(Array.from({length:Math.min(4,entries.length)},worker));
}

function cardHtml(a,i=0,stats=null){
  const title=a.title||'Álbum',date=a.event_date?dateLabel(a.event_date):(a.year||'Archivo'),s=stats?.[a.id];
  const n=s?Number(s.count||0):null,bytes=s?Number(s.bytes||0):0,cover=a.cover_url||'';
  const meta=n===null?'Cargando fotos…':`${n.toLocaleString('es-ES')} ${n===1?'foto':'fotos'}${bytes?` · ${formatBytes(bytes)}`:' · Tamaño no disponible'}`;
  const style=cover?` style="background-image:url('${esc(cover)}');background-size:cover;background-position:center"`:'';
  return `<button type="button" class="card" data-album-id="${esc(a.id||'')}" aria-label="Abrir álbum ${esc(title)}"><div class="${coverClass(i)}"${style}><span class="card-meta">${meta}</span><b>${esc(title)}</b></div><small>${esc(date)}</small><strong>${esc(title)}</strong></button>`;
}

async function refreshHeader(){
  const u=await currentUser();
  await loadSettings();
  await loadTheme();
  const nav=document.getElementById('adminNav');
  if(!u){
    accountBtn.innerHTML='Entrar';
    if(nav)nav.style.display='none';
    return;
  }
  const profile=await getCachedProfile(u.id,'full_name,role,avatar_path');
  const av=profile?.avatar_path?await mediaUrl(profile.avatar_path):'';
  const avatarHtml=av?`<img src="${esc(av)}" alt="">`:esc((profile?.full_name||u.email||'U').slice(0,1).toUpperCase());
  accountBtn.innerHTML=`<span class="header-avatar">${avatarHtml}</span><span>Mi cuenta</span>`;
  accountBtn.classList.toggle('has-avatar',true);
  if(nav)nav.style.display=profile?.role==='admin'?'flex':'none';
}

async function loadHomeData(){
  const {data:albums,error}=await sb.from('albums').select('id,title,year,event_date,description,created_at,is_published').eq('is_published',true).order('year',{ascending:false}).order('event_date',{ascending:false});
  if(error)return {albums:[],stats:{}};
  const ids=(albums||[]).map(a=>a.id);const stats=await getAlbumStats(ids);for(const a of albums||[]){a.photo_count=stats[a.id]?.count||0;a.total_bytes=stats[a.id]?.bytes||0}
  return {albums:await addAlbumCovers(albums||[]),stats};
}

function goHome(){return home()}

async function home(){
  const u=await currentUser();await loadTheme();await refreshHeader();let content='';
  const settings=siteSettings||await loadSettings();
  let importantHtml='',featuredHtml='',memoriesHtml='',eventsHtml='';
  if(u){
    const [nres,homeData,mems,evs]=await Promise.all([
      sb.from('notifications').select('id,title,body,created_at,is_important').eq('is_published',true).order('created_at',{ascending:false}).limit(5),
      loadHomeData(),
      loadMemories(3),
      loadUpcomingEvents(3)
    ]);
    const important=(nres.data||[]).filter(n=>n.is_important);

async function ensurePhotoLoaded(i){
  const item=(window.viewerItems||[])[i];if(!item)return null;if(item.url)return item;
  if(item._loading)return item._loading;
  item._loading=mediaUrl(item.storage_path).then(url=>{item.url=url||'';return item}).finally(()=>{delete item._loading});
  const out=await item._loading;
  const btn=document.querySelector(`.photo[data-photo-index="${i}"]`);
  if(btn&&out.url){btn.classList.add('real');btn.innerHTML=`<img src="${esc(out.url)}" alt="${esc(out.original_filename||'Fotografía')}" loading="lazy">`}
  return out;
}

async function renderAlbum(a){
  const r=await sb.from('photos').select('id,storage_path,original_filename,created_at,caption').eq('album_id',a.id).order('created_at',{ascending:false});
  if(r.error){toast(`No se han podido cargar las fotografías: ${r.error.message||'error de Appwrite'}`);return}
  const photos=r.data||[];
  const cached=albumStatsCache.get(a.id)||{};const count=Number(cached.count||photos.length);const bytes=Number(cached.bytes||0);
  window.viewerItems=photos.map(p=>({...p,url:''}));window.currentAlbumId=a.id;
  app.innerHTML=`<section class="page album-page"><button class="back" type="button" onclick="albums()">← Álbumes</button><div class="page-eyebrow">GALERÍA DE FOTOS</div><div class="album-head"><div><label>${esc(a.year||dateLabel(a.event_date))}</label><h1>${esc(a.title)}</h1><p>${esc(a.description||'')} · ${count.toLocaleString('es-ES')} fotografías${bytes?` · <b>${formatBytes(bytes)}</b>`:''}</p></div><div class="photo-tools"><button class="cta" onclick="downloadAlbum('${a.id}')">↓ Descargar</button></div></div><div id="photo-load-note" class="muted" style="margin-bottom:10px">Las fotografías se cargan a medida que aparecen en pantalla.</div>${photos.length?`<div class="photos">${photos.map((p,i)=>`<button type="button" class="photo" data-photo-index="${i}" onclick="showPhotoIndex(${i})"><div class="photo-placeholder">📷</div></button>`).join('')}</div>`:`<div class="empty"><b>📷</b><h2>Este álbum no tiene fotografías visibles</h2><p>El álbum se ha abierto correctamente, pero no se han encontrado fotografías disponibles.</p></div>`}</section>`;
  const buttons=[...document.querySelectorAll('.photo[data-photo-index]')];
  if(!('IntersectionObserver' in window)){
    for(let i=0;i<Math.min(8,photos.length);i++)await ensurePhotoLoaded(i);
  }else{
    const io=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){const b=entry.target;const i=Number(b.dataset.photoIndex);ensurePhotoLoaded(i).finally(()=>io.unobserve(b))}}},{rootMargin:'500px 0px'});
    buttons.forEach(b=>io.observe(b));
  }
  if(!photos.length){const n=document.getElementById('photo-load-note');if(n)n.textContent='';}
}

async function shareText(text){
  const message=`${siteSettings?.site_name||'Tarazona Fotos'} — ${text}\n${location.href}`;
  try{
    if(navigator.share){await navigator.share({title:siteSettings?.site_name||'Tarazona Fotos',text:message,url:location.href});return;}
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(message);toast('Enlace copiado. Puedes compartirlo desde tu teléfono.');return;}
    toast('Selecciona Compartir desde tu teléfono para enviar el enlace.');
  }catch(e){if(e?.name!=='AbortError')toast('No se pudo abrir el menú de compartir.');}
}
async function sharePhotoFile(name){
  const img=document.getElementById('viewerImg');
  if(!img?.src)return shareText(`📷 ${name}`);
  try{
    if(!navigator.share||!navigator.canShare)throw new Error('file-share-no');
    const res=await fetch(img.src,{mode:'cors'});if(!res.ok)throw new Error('image-fetch-failed');
    const blob=await res.blob();const ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const safeBase=(name||'fotografia').replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[^a-zA-Z0-9._-]+/g,'_');
    const file=new File([blob],`${safeBase}.${ext}`,{type:blob.type||'image/jpeg'});
    if(!navigator.canShare({files:[file]}))throw new Error('file-share-unsupported');
    await navigator.share({files:[file],title:name||'Fotografía',text:`${siteSettings?.site_name||'Tarazona Fotos'} — ${name||'Fotografía'}`});
  }catch(e){
    if(e?.name==='AbortError')return;
    await shareText(`📷 ${name}`);
  }
}

function isEmailLike(v){return !!v&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v).trim())}
async function account(user,p){
  const mode=await loadTheme();const avatar=p?.avatar_path?await mediaUrl(p.avatar_path):'';
  const displayName=p?.full_name&&!isEmailLike(p.full_name)?p.full_name:'';
  const needAlias=!displayName;
  app.innerHTML=`<section class="page"><label>MI CUENTA</label><div class="account-card"><div class="profile-head"><div class="avatar">${avatar?`<img src="${esc(avatar)}" alt="">`:(displayName||'U').slice(0,1).toUpperCase()}</div><div><h1>Hola${displayName?', '+esc(displayName):''} 👋</h1><p>${esc(user.email)}</p></div></div>${needAlias?`<div class="notice"><b>👤 Pon tu nombre o alias</b><div class="muted">Es el nombre que verán los demás en Personas y en tus comentarios. Tu correo no se mostrará.</div><button class="ghost" onclick="editMyProfile()">✏️ Añadir nombre o alias</button></div>`:''}<div class="account-actions"><button class="cta" onclick="albums()">Ver mis álbumes →</button><button class="ghost" onclick="editMyProfile()">✏️ ${displayName?'Cambiar nombre o alias':'Añadir nombre o alias'}</button><label class="ghost" style="display:inline-block">📷 Foto de perfil<input type="file" id="avatarFile" accept="image/*" hidden onchange="uploadAvatar(this.files[0])"></label><div class="row"><span class="muted">Tema</span>${themeControl(mode)}</div><button class="ghost" onclick="peoplePage()">Personas</button><button class="ghost" onclick="messagesPage()">Mensajes</button><button class="ghost" onclick="myPhotosPage()">Mis fotos</button><button class="ghost" onclick="myCommentsPage()">Mis comentarios</button><button class="ghost" onclick="requestsPage()">Mis solicitudes</button>${p?.role==='admin'?'<button class="cta" onclick="admin()">⚙️ Administración</button>':''}<button class="ghost" onclick="signOut()">Cerrar sesión</button></div></div></section>`
}
async function editMyProfile(){const u=await currentUser();if(!u)return openLogin();const {data:p}=await sb.from('profiles').select('full_name').eq('id',u.id).maybeSingle();const current=isEmailLike(p?.full_name)?'':(p?.full_name||'');body.innerHTML=`<div class="modal-head"><label>MI PERFIL</label><h2>Nombre o alias</h2><p>Este nombre aparecerá en Personas y junto a tus comentarios. Tu correo seguirá siendo privado.</p></div><input id="myName" value="${esc(current)}" maxlength="60" autocomplete="name" placeholder="Escribe tu nombre o alias" required><button class="cta full" onclick="saveMyProfile()">Guardar nombre</button>`;modal.classList.remove('hide');setTimeout(()=>document.getElementById('myName')?.focus(),80)}
async function saveMyProfile(){const u=await currentUser();if(!u)return openLogin();const name=document.getElementById('myName').value.trim();if(!name)return toast('Escribe un nombre o alias.');if(name.length>60)return toast('El nombre o alias no puede superar 60 caracteres.');try{await adminCall('save-profile',{full_name:name});await sb.auth.updateUser({data:{full_name:name}});profileCache.delete(u.id);profileCacheAt.delete(u.id);closeM();toast('Nombre o alias guardado.');routeUser()}catch(e){toast(e.message||'No se pudo guardar el nombre.')}}
async function uploadAvatar(file){if(!file)return;try{const data=await adminCall('upload-avatar',{user_id:(await currentUser()).id},file);toast('Foto de perfil actualizada.');routeUser()}catch(e){toast(`No se pudo actualizar la foto: ${e.message}`)}}

async function favorites(){const u=await currentUser();if(!u)return openLogin();const {data,error}=await sb.from('favorites').select('photo_id,created_at,photos(id,album_id,storage_path,original_filename,albums(title))').eq('user_id',u.id).order('created_at',{ascending:false});if(error)return toast(error.message);const items=[];for(const f of data||[]){const p=f.photos;if(!p)continue;items.push({...p,url:await mediaUrl(p.storage_path)})}app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">MIS FOTOS</div><h1>Favoritos</h1>${items.length?`<div class="photos">${items.map((p,i)=>`<button class="photo real" onclick="showPhoto('${esc(p.url)}','${esc(p.original_filename||'Fotografía')}','${p.id}',${i})"><img src="${esc(p.url)}" alt="" loading="lazy"></button>`).join('')}</div>`:`<div class="empty"><b>♡</b><h2>Aún no tienes favoritos</h2></div>`}</section>`;window.viewerItems=items}
function downloads(){app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">DESCARGAS</div><h1>Descargar fotografías</h1><p>Entra en cualquier álbum para descargar una foto o el álbum completo en ZIP.</p><button class="cta" onclick="albums()">Ver álbumes →</button></section>`}
async function myPhotosPage(){const u=await currentUser();if(!u)return openLogin();const {data,error}=await sb.from('photos').select('id,storage_path,original_filename,created_at').eq('uploaded_by',u.id).order('created_at',{ascending:false});if(error)return toast(error.message);const items=[];for(const p of data||[]){items.push({...p,url:await mediaUrl(p.storage_path)})}window.viewerItems=items;app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">MI CUENTA</div><h1>Mis fotos</h1><p>Fotografías que has subido a la fototeca.</p>${items.length?`<div class="photos">${items.map((p,i)=>`<button class="photo" onclick="showPhotoIndex(${i})"><img src="${esc(p.url)}" alt="${esc(p.original_filename||'Fotografía')}" loading="lazy"></button>`).join('')}</div>`:'<div class="empty">Todavía no has subido fotografías.</div>'}</section>`}
async function openCommentPhoto(photoId){if(!photoId)return toast('Esta fotografía ya no está disponible.');const {data:p,error}=await sb.from('photos').select('id,storage_path,original_filename,caption').eq('id',photoId).maybeSingle();if(error||!p?.storage_path)return toast('No se ha podido localizar la fotografía.');const url=await mediaUrl(p.storage_path);if(!url)return toast('No se ha podido cargar la fotografía.');window.viewerItems=[{...p,url}];window.viewerIndex=0;await showPhoto(url,p.original_filename||'Fotografía',p.id,0)}
async function myCommentsPage(){const u=await currentUser();if(!u)return openLogin();const {data,error}=await sb.from('comments').select('id,body,created_at,user_id,photo_id,photos(id,storage_path,original_filename,albums(title))').eq('is_visible',true).order('created_at',{ascending:false});if(error)return toast(error.message);const ids=[...new Set((data||[]).map(c=>c.user_id).filter(Boolean))];let names=new Map();if(ids.length){const pr=await sb.from('public_profiles').select('id,full_name').in('id',ids);names=new Map((pr.data||[]).map(p=>[p.id,p.full_name||'Usuario']))}const rows=[];for(const c of data||[]){const photo=c.photos;const clickable=!!photo?.id;rows.push(`<button type="button" class="notice comment-link-card${clickable?' is-clickable':''}" ${clickable?`onclick="openCommentPhoto('${photo.id}')"`: 'disabled'} aria-label="${clickable?'Abrir fotografía del comentario':'Fotografía no disponible'}"><div class="comment-row">${photo?.storage_path?`<span class="comment-thumb" aria-hidden="true"><img src="${esc(await mediaUrl(photo.storage_path))}" alt="" loading="lazy"></span>`:''}<span class="comment-content"><span class="row"><b>${esc(names.get(c.user_id)||'Usuario')}</b><small>${dateLabel(c.created_at)}</small></span><span class="comment-body">${esc(c.body)}</span>${photo?.original_filename?`<span class="muted small">📷 ${esc(photo.original_filename)}${photo.albums?.title?` · ${esc(photo.albums.title)}`:''}</span>`:''}<span class="comment-jump">${clickable?'📷 Abrir fotografía':'Fotografía no disponible'}</span></span></div></button>`)}app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">COMUNIDAD</div><h1>Comentarios</h1><p class="muted">Aquí aparecen los comentarios visibles de la comunidad. Pulsa cualquier comentario para ir directamente a su fotografía.</p>${rows.join('')||'<div class="empty">Todavía no hay comentarios.</div>'}</section>`}
async function requestsPage(){const u=await currentUser();if(!u)return openLogin();const {data,error}=await sb.from('removal_requests').select('id,photo_id,reason,status,admin_note,created_at').eq('user_id',u.id).order('created_at',{ascending:false});if(error)return toast(error.message);app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">PRIVACIDAD</div><h1>Mis solicitudes de retirada</h1>${(data||[]).map(r=>`<div class="notice"><div class="row"><b>${esc(r.status)}</b><small>${dateLabel(r.created_at)}</small></div><p>${esc(r.reason||'Sin motivo')}</p>${r.admin_note?`<p><b>Respuesta:</b> ${esc(r.admin_note)}</p>`:''}</div>`).join('')||'<div class="empty">No tienes solicitudes.</div>'}</section>`}
async function notifications(){const u=await currentUser();if(!u)return openLogin();const {data,error}=await sb.from('notifications').select('id,title,body,created_at,is_important').eq('is_published',true).order('is_important',{ascending:false}).order('created_at',{ascending:false});if(error)return toast(error.message);app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">NOTIFICACIONES</div><h1>Avisos</h1>${(data||[]).map(n=>`<div class="notice ${n.is_important?'important':''}"><div class="row"><b>${n.is_important?'⚠️ ':''}${esc(n.title)}</b><small>${dateLabel(n.created_at)}</small></div><p>${esc(n.body||'')}</p></div>`).join('')||'<div class="empty">No hay notificaciones.</div>'}</section>`}
async function peoplePage(){const u=await currentUser();if(!u)return openLogin();const {data,error}=await sb.from('public_profiles').select('id,full_name,avatar_path').order('full_name');if(error)return toast(error.message);let people=await Promise.all((data||[]).map(async p=>({...p,avatar_url:p.avatar_path?await mediaUrl(p.avatar_path):''})));app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">COMUNIDAD</div><h1>Personas</h1><input id="peopleQ" placeholder="Buscar persona…" oninput="filterPeople(this.value)"><div id="peopleList" class="person-list">${people.map(personCard).join('')}</div></section>`;window.peopleCache=people}
function personCard(p){const name=(p.full_name||'Usuario').trim()||'Usuario';return `<div class="person-card"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:name.slice(0,1).toUpperCase()}</div><div style="min-width:0;flex:1"><b>${esc(name)}</b><button class="ghost" onclick="messagesPage('${p.id}')">Mensaje</button></div></div>`}
function filterPeople(q){q=(q||'').toLowerCase();const list=(window.peopleCache||[]).filter(p=>(p.full_name||'').toLowerCase().includes(q));document.getElementById('peopleList').innerHTML=list.map(personCard).join('')||'<p class="muted">No hay coincidencias.</p>'}
async function messagesPage(recipientId=null){const u=await currentUser();if(!u)return openLogin();const {data:people,error:peopleError}=await sb.from('public_profiles').select('id,full_name,avatar_path').neq('id',u.id).order('full_name');if(peopleError){toast('No se han podido cargar las personas.');return}const selected=recipientId||activeMessageUser||people?.[0]?.id;activeMessageUser=selected;app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">COMUNIDAD</div><h1>Mensajes</h1><div class="message-layout"><div class="message-users">${(people||[]).map(p=>`<button class="message-user ${p.id===selected?'active':''}" onclick="messagesPage('${p.id}')"><b>${esc(p.full_name||'Usuario')}</b></button>`).join('')||'<p class="muted">No hay otras personas registradas.</p>'}</div><div class="message-pane"><div id="messagePane">Cargando…</div></div></div></section>`;await renderMessages(selected);if(messagePolling)clearInterval(messagePolling);messagePolling=setInterval(()=>renderMessages(selected,true),12000)}
async function renderMessages(other,quiet=false){const pane=document.getElementById('messagePane');if(!pane)return;const u=await currentUser();if(!u){pane.innerHTML='<p class="muted">Inicia sesión para ver los mensajes.</p>';return}if(!other){pane.innerHTML='<p class="muted">Selecciona una persona para empezar una conversación.</p>';return}const {data,error}=await sb.from('messages').select('id,sender_id,recipient_id,body,created_at,is_read').or(`and(sender_id.eq.${u.id},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${u.id})`).order('created_at',{ascending:true});if(error){pane.innerHTML=`<div class="notice"><b>No se han podido cargar los mensajes.</b><p class="muted">${esc(error.message||'Error desconocido')}</p></div>`;if(!quiet)toast('No se han podido cargar los mensajes.');return}pane.innerHTML=`<div id="messages" class="messages">${(data||[]).map(m=>`<div class="bubble ${m.sender_id===u.id?'mine':''}">${esc(m.body)}<div class="small" style="opacity:.7">${dateLabel(m.created_at)}</div></div>`).join('')||'<p class="muted">Aún no hay mensajes.</p>'}</div><div class="comment-form"><input id="messageInput" placeholder="Escribe un mensaje…"><button class="cta" onclick="sendMessage('${other}')">Enviar</button></div>`;const box=document.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}
async function sendMessage(recipientId){const u=await currentUser();const input=document.getElementById('messageInput'),textV=input?.value.trim();if(!u||!textV)return;const {error}=await sb.from('messages').insert({sender_id:u.id,recipient_id:recipientId,body:textV});if(error)return toast(error.message);input.value='';renderMessages(recipientId)}

async function calendarPage(){const {data,error}=await sb.from('events').select('id,title,event_date,event_time,location,description,map_url,is_published').eq('is_published',true).order('event_date',{ascending:true}).order('event_time',{ascending:true});if(error)return toast(error.message);app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">CALENDARIO</div><h1>Próximos actos</h1><div class="inline-grid">${(data||[]).map(eventCardHtml).join('')||'<div class="empty">No hay próximos actos.</div>'}</div></section>`}
function eventCardHtml(e){return `<div class="event-card notice"><div class="chip">📅 ${esc(dateLabel(e.event_date))}${e.event_time?` · ${esc(String(e.event_time).slice(0,5))}`:''}</div><h3>${esc(e.title)}</h3>${e.location?`<p>📍 ${esc(e.location)}</p>`:''}${e.description?`<p>${esc(e.description)}</p>`:''}${e.map_url?`<a class="ghost" href="${esc(e.map_url)}" target="_blank" rel="noopener">🗺️ Cómo llegar</a>`:''}</div>`}
async function placesPage(){const {data,error}=await sb.from('places').select('id,name,address,description,map_url').order('name');if(error)return toast(error.message);app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">LUGARES</div><h1>Lugares</h1><div class="inline-grid">${(data||[]).map(p=>`<div class="notice place-card"><h3>${esc(p.name)}</h3>${p.address?`<p>📍 ${esc(p.address)}</p>`:''}${p.description?`<p>${esc(p.description)}</p>`:''}${p.map_url?`<a class="ghost" href="${esc(p.map_url)}" target="_blank" rel="noopener">🗺️ Ver mapa</a>`:''}</div>`).join('')||'<div class="empty">No hay lugares todavía.</div>'}</div></section>`}
async function memoriesPage(){const data=await loadMemories(50);app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">RECUERDOS</div><h1>Tal día como hoy</h1><div class="inline-grid">${(data||[]).map(m=>`<div class="notice"><b>${esc(m.title)}</b><p>Hace ${m.years} ${m.years===1?'año':'años'} · ${dateLabel(m.event_date)}</p><button class="ghost" onclick="openAlbum('${m.id}')">Ver álbum</button></div>`).join('')||'<div class="empty">No encontramos recuerdos para esta fecha.</div>'}</div></section>`}
async function loadMemories(limit=10){const now=new Date();const mm=String(now.getMonth()+1).padStart(2,'0'),dd=String(now.getDate()).padStart(2,'0');const {data}=await sb.from('albums').select('id,title,event_date').eq('is_published',true).not('event_date','is',null);return (data||[]).filter(a=>{const s=String(a.event_date);return s.slice(5,10)===`${mm}-${dd}`&&Number(s.slice(0,4))<now.getFullYear()}).sort((a,b)=>Number(b.event_date.slice(0,4))-Number(a.event_date.slice(0,4))).slice(0,limit).map(a=>({...a,years:now.getFullYear()-Number(a.event_date.slice(0,4))}))}
async function loadUpcomingEvents(limit=5){const today=new Date().toISOString().slice(0,10);const {data}=await sb.from('events').select('id,title,event_date,event_time,location,description,map_url').eq('is_published',true).gte('event_date',today).order('event_date',{ascending:true}).order('event_time',{ascending:true}).limit(limit);return data||[]}

async function searchPage(){app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">BUSCAR</div><h1>Buscar fotos y personas</h1><input id="searchInput" class="search-box" placeholder="Álbum, fotografía o persona…" oninput="runSearch(this.value)"><div id="searchResults"></div></section>`}
async function runSearch(q){const el=document.getElementById('searchResults');if(!el)return;q=q.trim();if(q.length<2){el.innerHTML='<p class="muted">Escribe al menos 2 caracteres.</p>';return}const {data:als}=await sb.from('albums').select('id,title,year,event_date').eq('is_published',true).ilike('title',`%${q}%`).limit(20);const {data:photos}=await sb.from('photos').select('id,storage_path,original_filename,albums(title)').eq('is_published',true).ilike('original_filename',`%${q}%`).limit(30);const {data:people}=await sb.from('public_profiles').select('id,full_name,avatar_path').ilike('full_name',`%${q}%`).limit(20);let html=`<h3>Álbumes</h3>${(als||[]).map(a=>`<button class="admin-item" onclick="openAlbum('${a.id}')"><b>${esc(a.title)}</b><span>${esc(a.year||dateLabel(a.event_date))}</span></button>`).join('')||'<p class="muted">Sin álbumes.</p>'}<h3>Personas</h3>${(people||[]).map(personCard).join('')||'<p class="muted">Sin personas.</p>'}<h3>Fotografías</h3><div class="search-results-grid">${await Promise.all((photos||[]).map(async p=>{const url=await mediaUrl(p.storage_path);return `<button class="photo" onclick="showPhoto('${esc(url)}','${esc(p.original_filename||'Fotografía')}','${p.id}',0)"><img src="${esc(url)}" alt="" loading="lazy"></button>`})).then(x=>x.join(''))||'<p class="muted">Sin fotografías.</p>'}</div>`;el.innerHTML=html}

function aboutPage(){const s=siteSettings||fallbackSite;app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">INFORMACIÓN</div><h1>Sobre nosotros</h1><div class="panel"><p>${esc(s.about_text)}</p><p>Una fototeca privada para conservar y compartir los recuerdos de la comisión.</p></div></section>`}
function contactPage(){const s=siteSettings||fallbackSite;app.innerHTML=`<section class="page"><button class="back" onclick="home()">← Inicio</button><div class="page-eyebrow">CONTACTO</div><h1>Contacto</h1><div class="panel"><p>Para consultas o solicitudes relacionadas con fotografías:</p>${s.contact_email?`<a class="cta" href="mailto:${esc(s.contact_email)}">✉️ ${esc(s.contact_email)}</a>`:'<p class="muted">El correo de contacto todavía no está configurado.</p>'}</div></section>`}

async function admin(){
  await loadTheme();app.innerHTML=`<section class="page admin"><div class="admin-head"><div><label>TARAZONA FOTOS</label><h1>Administrador</h1><p class="muted">Control completo de la web: contenido, usuarios, fotos, comentarios, solicitudes y personalización.</p></div><div class="admin-actions"><button class="ghost" onclick="goHome()">Ver web</button><button class="ghost" onclick="setThemeMode(document.documentElement.dataset.themeMode==='dark'?'light':'dark')">🌙 Tema</button><button class="danger" onclick="signOut()">Cerrar sesión</button></div></div><div class="tabs" role="tablist"><button class="active" data-admin-tab="resumen" onclick="adminTab('resumen',this)">Resumen</button><button data-admin-tab="albumes" onclick="adminTab('albumes',this)">Álbumes</button><button data-admin-tab="fotos" onclick="adminTab('fotos',this)">📷 Fotos</button><button data-admin-tab="eventos" onclick="adminTab('eventos',this)">📅 Calendario</button><button data-admin-tab="lugares" onclick="adminTab('lugares',this)">⌖ Lugares</button><button data-admin-tab="comentarios" onclick="adminTab('comentarios',this)">💬 Comentarios</button><button data-admin-tab="solicitudes" onclick="adminTab('solicitudes',this)">⚑ Solicitudes</button><button data-admin-tab="notificaciones" onclick="adminTab('notificaciones',this)">🔔 Notificaciones</button><button data-admin-tab="usuarios" onclick="adminTab('usuarios',this)">👥 Usuarios</button><button data-admin-tab="portada" onclick="adminTab('portada',this)">🖼️ Portada</button><button data-admin-tab="destacada" onclick="adminTab('destacada',this)">⭐ Destacada</button><button data-admin-tab="personalizacion" onclick="adminTab('personalizacion',this)">🎨 Personalización</button></div><div id="adminPanel"></div></section>`;adminTab('resumen',document.querySelector('.tabs button'))}
async function adminTab(tab,btn){

async function uploadPhotos(){const albumId=document.getElementById('photoAlbum').value,files=[...document.getElementById('photoFiles').files],status=document.getElementById('uploadStatus'),btn=document.getElementById('uploadBtn');if(!albumId||!files.length)return toast('Selecciona un álbum y al menos una fotografía.');const u=await currentUser();if(!u)return openLogin();btn.disabled=true;status.style.display='block';status.textContent=`Preparando ${files.length} fotografías…`;let ok=0;for(let i=0;i<files.length;i++){const original=files[i];try{const f=await compressPhoto(original);const safeName=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${albumId}/${crypto.randomUUID()}-${safeName}`;status.textContent=`Subiendo ${i+1} de ${files.length}: ${original.name}`;const form=new FormData();form.append('albumId',albumId);form.append('originalName',original.name);form.append('file',f,f.name);const headers=await functionAuthHeaders();if(!headers)throw new Error('La sesión ha caducado.');const {data:up,error:upError}=await sb.functions.invoke('dropbox-media?action=upload',{body:form,headers});if(upError)throw upError;if(up?.error)throw new Error(up.error);const ins=await sb.from('photos').insert({album_id:albumId,storage_path:up.storage_path,original_filename:original.name,uploaded_by:u.id});if(ins.error)throw ins.error;ok++}catch(e){toast(`Error en ${original.name}: ${e.message||e}`);break}}status.textContent=`✓ ${ok} de ${files.length} fotografías subidas.`;btn.disabled=false;if(ok===files.length)document.getElementById('photoFiles').value='';loadAdminPhotos()}
async function compressPhoto(file){if(!file.type.startsWith('image/'))return file;const MAX_BYTES=1024*1024;if(file.size<=MAX_BYTES)return file;const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(file));let width=bitmap.width,height=bitmap.height;const maxDimension=2400;if(Math.max(width,height)>maxDimension){const s=maxDimension/Math.max(width,height);width=Math.round(width*s);height=Math.round(height*s)}const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});const makeBlob=(w,h,q)=>new Promise((res,rej)=>{canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);ctx.drawImage(bitmap,0,0,w,h);canvas.toBlob(b=>b?res(b):rej(new Error('No se pudo comprimir la imagen')),'image/jpeg',q)});let blob=null;for(const q of [.84,.78,.72,.66,.60,.55,.50]){blob=await makeBlob(width,height,q);if(blob.size<=MAX_BYTES)break}while(blob&&blob.size>MAX_BYTES&&Math.max(width,height)>1600){width=Math.round(width*.85);height=Math.round(height*.85);blob=await makeBlob(width,height,.72)}bitmap.close?.();if(!blob)throw new Error('No se pudo preparar la fotografía');const base=file.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9._-]/g,'_');return new File([blob],`${base}.jpg`,{type:'image/jpeg',lastModified:Date.now()})}

async function setupSwipe(){let sx=null,sy=null;modal.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});modal.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){moveViewer(dx<0?1:-1)}sx=sy=null},{passive:true})}

/* V1.6 — navegación con botón Atrás del móvil.
   La web es una SPA: las pantallas cambian sin cargar otra URL. Por eso
   el historial del navegador se rellena manualmente para que Atrás vuelva
   a la pantalla anterior en vez de sacar al usuario de la web. */
(function setupBrowserBackNavigation(){
  const routeNames=['home','albums','openAlbum','accountRoute','favorites','downloads','myPhotosPage','myCommentsPage','requestsPage','notifications','peoplePage','messagesPage','calendarPage','placesPage','memoriesPage','searchPage','aboutPage','contactPage','admin'];
  const originals={};
  let restoring=false;
  let started=false;

  routeNames.forEach(name=>{
    if(typeof window[name]!=='function') return;
    originals[name]=window[name];
    window[name]=function(...args){
      if(!restoring && started){
        const state={tfRoute:name,tfArgs:args};
        history.pushState(state,'','');
      }
      return originals[name].apply(this,args);
    };
  });

  history.replaceState({tfRoute:'home',tfArgs:[]},'',location.href);
  started=true;

  // Navegación de Inicio explícita para móvil: no depende de que el botón del navegador
  // tenga historial previo y fuerza el render de la pantalla inicial.
  window.goHome=function(){
    closeSide();
    try{history.replaceState({tfRoute:'home',tfArgs:[]},'',location.href.split('#')[0])}catch(e){}
    try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}
    return originals.home.apply(window,[]);
  };

  window.addEventListener('popstate',function(e){
    closeSide();
    if(!e.state || !e.state.tfRoute){
      return;
    }
    const fn=originals[e.state.tfRoute];
    if(typeof fn!=='function') return;
    restoring=true;
    Promise.resolve(fn.apply(window,e.state.tfArgs||[])).finally(()=>{restoring=false;});
  });
})();

</script>
